services:
  # Backend Node.js Service
  - type: web
    name: ada-backend
    env: node
    buildCommand: "cd server && npm install"
    startCommand: "cd server && node server.js"
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend React (Vite) Static Site
  - type: web
    name: ada-frontend
    env: static
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/dist"
    # IMPORTANT: After the backend is deployed, copy its URL and set it as VITE_API_URL in the Render dashboard for the frontend.
    envVars:
      - key: VITE_API_URL
        sync: false
